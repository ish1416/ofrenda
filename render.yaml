services:
  - type: web
    name: ofrenda-living-altar
    runtime: python
    plan: free
    region: oregon
    healthCheckPath: /api/health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SENTRY_DSN
        sync: false
      - key: OLLAMA_HOST
        value: http://localhost:11434
      - key: GEMMA_MODEL
        value: gemma2:9b
      - key: DEMO_MODE
        value: "true"
